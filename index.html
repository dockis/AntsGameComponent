<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Mravenci vs. kostka cukru</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game-container">
    <div id="hud">
      <div id="hud-level-row">Level <span id="hud-level">1</span></div>
      <div id="hud-kills-row">Zabito: <span id="hud-kills">0 / 0</span></div>
      <div id="hud-health-track">
        <div id="hud-health-bar"></div>
      </div>
    </div>
    <svg id="scene" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
      <g id="target" transform="translate(200,400)">
        <g id="target-state-0" class="target-state">
          <polygon points="-70,-70 70,-70 70,70 -70,70" fill="#fdf6ea" stroke="#e3d3ab" stroke-width="4" />
        </g>
        <g id="target-state-1" class="target-state" style="display:none">
          <polygon points="-70,-70 40,-70 70,-40 70,70 -70,70" fill="#f3e3bd" stroke="#cdb37e" stroke-width="4" />
        </g>
        <g id="target-state-2" class="target-state" style="display:none">
          <polygon points="-70,-70 40,-70 70,-40 70,70 -35,70 -70,35" fill="#e0c290" stroke="#a9865a" stroke-width="4" />
        </g>
        <g id="target-state-3" class="target-state" style="display:none">
          <polygon points="-30,-70 40,-70 70,-40 70,70 -35,70 -70,35 -70,-30" fill="#c39f6c" stroke="#8a6a42" stroke-width="4" />
        </g>
        <g id="target-state-4" class="target-state" style="display:none">
          <polygon points="-20,-70 -10,-70 -10,-40 10,-40 10,-70 20,-70 70,-20 70,20 20,70 -20,70 -70,20 -70,-20" fill="#a3825a" stroke="#6b4f30" stroke-width="4" />
        </g>
        <g id="target-state-5" class="target-state" style="display:none">
          <rect x="-70" y="-70" width="140" height="140" fill="none" stroke="#5a5248" stroke-width="1" stroke-dasharray="6 6" opacity="0.3" />
          <rect x="-40" y="8" width="14" height="10" fill="#7a5c3a" transform="rotate(15 -33 13)" />
          <rect x="4" y="-18" width="10" height="8" fill="#7a5c3a" transform="rotate(-20 9 -14)" />
          <rect x="-12" y="28" width="9" height="8" fill="#7a5c3a" transform="rotate(10 -8 32)" />
          <rect x="22" y="14" width="11" height="7" fill="#7a5c3a" transform="rotate(30 28 18)" />
          <rect x="-25" y="-30" width="8" height="7" fill="#7a5c3a" transform="rotate(-8 -21 -27)" />
        </g>
      </g>
      <g id="ants-layer"></g>
    </svg>
    <div id="screen-onboarding" class="onboarding">Klepni na mravence, chraň kostku cukru!</div>
    <div id="screen-menu" class="screen">
      <div class="screen-content">
        <h1>Mravenci vs. kostka cukru</h1>
        <button id="menu-start-btn" type="button">Start</button>
      </div>
    </div>
    <div id="screen-level-complete" class="screen">
      <div class="screen-content">
        <h2 id="level-complete-title">Level splněn!</h2>
        <button id="level-complete-continue-btn" type="button">Pokračovat</button>
      </div>
    </div>
    <div id="screen-game-over" class="screen">
      <div class="screen-content">
        <h2>Kostka snědena!</h2>
        <p id="game-over-info"></p>
        <button id="game-over-retry-btn" type="button">Zkusit znovu</button>
      </div>
    </div>
    <div id="screen-paused" class="screen">
      <div class="screen-content">
        <h2>Pauza</h2>
        <button id="paused-resume-btn" type="button">Pokračovat</button>
      </div>
    </div>
    <div id="debug-controls">
      <button id="debug-damage-btn" type="button">Poškodit (-10)</button>
    </div>
  </div>
  <script type="module" src="js/game.js"></script>
</body>
</html>
