<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Mravenci vs. kostka cukru</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game-container">
    <div id="hud">
      <div id="hud-level-row">Level <span id="hud-level">1</span></div>
      <div id="hud-kills-row">Zabito: <span id="hud-kills">0 / 0</span></div>
      <div id="hud-health-track">
        <div id="hud-health-bar"></div>
      </div>
    </div>
    <svg id="scene" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
      <g id="target" transform="translate(200,400)">
        <g id="target-state-0" class="target-state"></g>
        <g id="target-state-1" class="target-state" style="display:none"></g>
        <g id="target-state-2" class="target-state" style="display:none"></g>
        <g id="target-state-3" class="target-state" style="display:none"></g>
        <g id="target-state-4" class="target-state" style="display:none"></g>
        <g id="target-state-5" class="target-state" style="display:none"></g>
      </g>
      <g id="stains-layer"></g>
      <g id="ants-layer"></g>
    </svg>
    <div id="screen-onboarding" class="onboarding">Klepni na mravence dřív, než sní kostku cukru!</div>
    <div id="screen-menu" class="screen">
      <div class="screen-content">
        <h1>Mravenci vs. kostka cukru</h1>
        <button id="menu-continue-btn" type="button" class="hidden">Pokračovat</button>
        <button id="menu-start-btn" type="button">Start</button>
        <button id="menu-mute-btn" type="button" class="menu-mute-btn">Zvuk: zapnutý</button>
      </div>
    </div>
    <div id="screen-level-complete" class="screen">
      <div class="screen-content">
        <h2 id="level-complete-title">Level splněn!</h2>
        <button id="level-complete-continue-btn" type="button">Pokračovat</button>
      </div>
    </div>
    <div id="screen-game-over" class="screen">
      <div class="screen-content">
        <h2>Kostka snědena!</h2>
        <p id="game-over-info"></p>
        <button id="game-over-retry-btn" type="button">Zkusit znovu</button>
      </div>
    </div>
    <div id="screen-paused" class="screen">
      <div class="screen-content">
        <h2>Pauza</h2>
        <button id="paused-resume-btn" type="button">Pokračovat</button>
      </div>
    </div>
  </div>
  <script type="module" src="js/game.js"></script>
</body>
</html>
